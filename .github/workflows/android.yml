name: Construire l'APK Android

on:
  push:
    branches: [main, ccr-fc9f6980-dm8omf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        # Le téléchargement de Gradle renvoie parfois 504 : jusqu'à 3 tentatives.
        run: |
          for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && exit 0; echo "Tentative $i échouée"; sleep $((i*20)); done
          exit 1
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk youfree.apk
      - uses: actions/upload-artifact@v4
        with:
          name: youfree-apk
          path: youfree.apk
      - name: Publier dans la release « android-latest »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Youfree Android (dernière version)
          prerelease: true
          files: youfree.apk
          body: |
            APK de test (signé avec une clé de débogage), construit depuis ${{ github.sha }}.
            Sur le téléphone : télécharge youfree.apk, ouvre-le et autorise l'installation depuis cette source.
